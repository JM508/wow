baseURL = "https://wow-d9s.pages.dev/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "Wow 娱乐小站"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  defaultTheme = "dark"
  # 站点级 SEO：env=production 让 PaperMod 的 OG / Twitter / Schema 模板稳定输出
  env = "production"
  description = "Wow 娱乐小站：扫雷、火柴人快跑、井字棋、贪吃蛇，打开即玩，无需下载。"
  keywords = ["小游戏", "在线游戏", "扫雷", "火柴人快跑", "井字棋", "贪吃蛇", "免费游戏"]
  # 缓存穿透版本号：所有静态资源按 ?v=<assetVer> 引用并配一年强缓存。
  # 该值由 scripts/set-version.sh 在构建时自动替换为当前 commit SHA（或 tag），
  # 每次部署天然唯一，无需手动维护 —— 不要在这里手写版本（占位符 devbuild 仅作兜底）。
  assetVer = "devbuild"
  # 站点仓库（首页页脚展示）
  githubUrl = "https://github.com/JM508/wow"
  # 首页入口：「小游戏」主按钮 + 「壁纸」次级按钮，竖排（壁纸在小游戏下面）
  homeInfoParams = {Title = "欢迎来到我的娱乐小站", Content = "<div class=\"games-entry\"><a class=\"games-entry-btn\" href=\"/games/\">小游戏</a><a class=\"games-entry-btn games-entry-ghost\" href=\"/wallpapers/\">壁纸</a></div>"}
  ShowReadingTime = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 首页「玩游戏」卡片需要写入原生 HTML（homeInfoParams.Content）
      unsafe = true

# 构建后压缩产物（Hugo 内置 minify，无需外部工具）
# HTML 暂不压缩：Hugo 会把属性引号一并省掉（href="/x" → href=/x），
# 站点测试与若干探针按带引号属性断言，压缩收益（每页约 1KB）不值得引入回归；
# CSS / JS / XML 仍照常压缩（PaperMod 本身也对资源做 Minify）。
[minify]
  minifyOutput = true
  disableHTML = true

# 最小权限：本项目构建不使用任何外部命令（无 PostCSS / Tailwind / Sass / Node），
# 显式清空 exec 白名单，避免主题或依赖拿到不必要的执行权限。
[security.exec]
  allow = []

# assetVer 版本注入：模板 partial（layouts/_partials/assetVer.html）构建期读取
# 构建平台注入的 commit SHA 环境变量，需在此放行（含 Hugo 默认的 HUGO_/CI）。
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^CF_PAGES_COMMIT_SHA$', '^GITHUB_SHA$', '^WOW_ASSET_SHA$']
