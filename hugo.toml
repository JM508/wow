baseURL = "https://wow-d9s.pages.dev/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "Wow 娱乐小站"
theme = "PaperMod"
enableRobotsTXT = true

[params]
  defaultTheme = "dark"
  # 自定义静态资源（/site.css /age-gate.js /runner.js 等）的缓存穿透版本号：
  # 改了 JS/CSS 记得把这里换个新值（配合 _headers 里对 /*.js / *.css 的一年强缓存）
  assetVer = "v20261007a"
  # 站点仓库（首页页脚展示）
  githubUrl = "https://github.com/JM508/wow"
  # 首页只留标题 + 「玩游戏」入口按钮（描述句与「进入游戏合集：…」副标题已按需求去掉）
  homeInfoParams = {Title = "欢迎来到我的娱乐小站", Content = "<div class=\"games-entry\"><a class=\"games-entry-btn\" href=\"/games/\">玩游戏</a></div>"}
  ShowReadingTime = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 首页「玩游戏」卡片需要写入原生 HTML（homeInfoParams.Content）
      unsafe = true
