name: Hugo 构建与门禁

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免连续 push 排队
concurrency:
  group: hugo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 主题 PaperMod 是 git 子模块（.gitmodules → themes/PaperMod）；
      # 不拉子模块时 themes/ 为空，Hugo 会报 partial "author.html" not found 直接失败。
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: false

      - name: 构建（--gc 清缓存；版本号由模板读取 GITHUB_SHA 自动注入）
        run: hugo --gc --cleanDestinationDir

      - name: 图片体积预算（单张图片不超过 600KB）
        run: |
          overs=$(find static -type f \( -name '*.webp' -o -name '*.png' -o -name '*.jpg' -o -name '*.avif' \) -size +600k)
          if [ -n "$overs" ]; then
            echo "以下图片超过 600KB 预算："
            echo "$overs"
            exit 1
          fi

      - name: 调试参数门禁（生产 JS 只允许 shop.js 的本地限定 grant）
        run: |
          hits=$(grep -rln '[?&]grant=' static --include='*.js' | grep -v '^static/shop.js$' || true)
          if [ -n "$hits" ]; then
            echo "以下 JS 含调试参数入口：$hits"
            exit 1
          fi
          grep -q 'localhost\|127.0.0.1\|::1' static/shop.js || { echo "shop.js 缺少本地限定"; exit 1; }

      - name: 产物自检（首页与壁纸页必须存在）
        run: |
          test -f public/index.html || { echo "缺少 public/index.html"; exit 1; }
          test -f public/wallpapers/index.html || { echo "缺少 public/wallpapers/index.html"; exit 1; }

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: public
          path: public/
