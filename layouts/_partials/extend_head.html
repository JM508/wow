<!-- ══════════════════════════════════════════════════════════════════════════
     年龄验证门禁 + 会话背景图（外部资源版）
     ──────────────────────────────────────────────────────────────────────────
     本文件是 Hugo PaperMod 的 head 挂载点：layouts/_partials/extend_head.html
     逻辑实现在 static/age-gate.css 与 static/age-gate.js（构建时复制到站点根）。
     拆成外部文件的原因：CSP 不再需要 unsafe-inline（安全评级 A+ 的前提），
     head 内同步外链脚本依然是阻塞式执行，防正文闪现的行为与内联版完全一致。
     ⚠️ 若修改 static/age-gate.* 或主题内联代码，需同步更新 static/_headers
        里 CSP 的 sha256 哈希白名单（见 _dev/check_csp.js）。
     ══════════════════════════════════════════════════════════════════════ -->
<!-- 自定义静态资源统一带 ?v= 版本号：配合 _headers 对 /*.js、/*.css 的一年强缓存，
     版本号变化即缓存穿透（值在 hugo.toml 的 params.assetVer） -->
{{- $v := printf "?v=%s" (site.Params.assetVer | default "1") }}
<script src="/theme.js{{ $v }}"></script>
<link rel="stylesheet" href="/site.css{{ $v }}">
<link rel="stylesheet" href="/age-gate.css{{ $v }}">
<script src="/age-gate.js{{ $v }}"></script>
<!-- 游戏 CSS 提升到 head（原写在 shortcode 里，位于 body 中部会阻塞游戏区渲染：
     浏览器要等这批 CSS 到齐才给 run-root 布局，弱网下游戏区有约 1s 的空白期；
     每页的清单在该页 front matter 的 gameCss 参数里声明） -->
{{- range .Params.gameCss }}
<link rel="stylesheet" href="/{{ . }}.css{{ $v }}">
{{- end }}
<!-- 壁纸页首屏前三张缩略图 preload（清单在该页 front matter 的 wpPreload 参数里）：
     壁纸网格的 LCP 元素是首行缩略图，提前拉起可省一整轮请求排队 -->
{{- range .Params.wpPreload }}
<link rel="preload" as="image" type="image/avif" href="/wp/{{ . }}-640.avif">
{{- end }}
<!-- 核心 Web 指标监控：采集真实用户的 LCP / CLS / INP / FCP / TTFB，匿名上报到自有云表 -->
<script src="/vitals.js{{ $v }}" defer></script>
<!-- 百度搜索资源平台站点验证（值配置在 hugo.toml params.baiduSiteVerification） -->
{{- with site.Params.baiduSiteVerification }}
<meta name="baidu-site-verification" content="{{ . }}">
{{- end }}
