<!-- ══════════════════════════════════════════════════════════════════════════
     全站挂载：会话背景图轮换 + 年龄声明样式
     · 年龄声明文案在 layouts/_partials/extend_footer.html（PaperMod 页脚挂载点）
     · Hugo 会把本文件当模板解析：请勿出现「连续两个左花括号」，否则构建报错
     ══════════════════════════════════════════════════════════════════════════ -->

<style id="ag-style">
  /* ── 会话背景图：每次新开浏览器随机换一张，白色蒙版保证正文可读 ── */
  #ag-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }
  #ag-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #ffffff;
    opacity: var(--ag-dim, 0.4);
  }
  [data-theme="dark"] #ag-bg::after { background: #000000; }
  /* 让正文容器透明，露出背景图（卡片仍保留自己的底色） */
  html[data-ag-bg] body,
  html[data-ag-bg] .list { background: transparent !important; }

  /* ── 页脚年龄声明 ── */
  .ag-declare {
    margin: 0;
    padding: 4px 16px 30px;
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
    color: var(--secondary, #6b6b6b);
  }
  .ag-declare b { color: var(--primary, #1f1f1f); }
</style>

<script id="ag-script">
(function () {
  "use strict";

  /* ═══════════════ 可配置项：只改这一段 ═══════════════ */
  var CFG = {
    /* 站点背景图：/images/bg/bg1.jpg ~ bg{bgCount}.jpg
       每次新开浏览器访问随机换一张（保证与上一张不同） */
    bgCount: 10,
    bgFolder: "/images/bg/bg",
    bgExt: ".jpg",
    bgDim: 0.4      // 白色蒙版浓度：0 = 原图，1 = 纯白
  };
  /* ═══════════════════════════════════════════════════ */

  /* ---------- 会话背景图：每次新开浏览器随机换一张（与上次不同） ---------- */
  function applyBg() {
    var n = CFG.bgCount;
    if (!n) return;
    var idx = -1, last = -1;
    try { idx = parseInt(sessionStorage.getItem("ag_bg"), 10); } catch (e) {}
    if (!(idx >= 0 && idx < n)) {                 // 本会话还没选过 → 选一张
      try { last = parseInt(localStorage.getItem("ag_bg_last"), 10); } catch (e) {}
      idx = Math.floor(Math.random() * n);
      if (n > 1 && idx === last) idx = (idx + 1) % n;   // 不与上一张重复
      try {
        sessionStorage.setItem("ag_bg", String(idx));
        localStorage.setItem("ag_bg_last", String(idx));
      } catch (e) {}
    }
    var el = document.createElement("div");
    el.id = "ag-bg";
    el.setAttribute("aria-hidden", "true");
    el.style.backgroundImage = 'url("' + CFG.bgFolder + (idx + 1) + CFG.bgExt + '")';
    el.style.setProperty("--ag-dim", String(CFG.bgDim));
    document.body.appendChild(el);
    document.documentElement.setAttribute("data-ag-bg", "1");
  }

  /* ---------- 启动 ---------- */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyBg);
  } else {
    applyBg();
  }
})();
</script>
<!-- ══════════════════ 全站挂载结束 ══════════════════ -->
