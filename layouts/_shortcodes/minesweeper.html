<!-- 扫雷小游戏：样式与逻辑均为外链静态文件（CSP 纯同源白名单，禁内联脚本） -->
<link rel="stylesheet" href="/minesweeper.css{{ with site.Params.assetVer }}?v={{ . }}{{ end }}">
<div id="ms-root" aria-label="扫雷小游戏">
  <div class="ms-bar">
    <a class="site-back" href="/" title="返回首页">← 首页</a>
    <select id="ms-level" aria-label="难度">
      <option value="easy" selected>初级 9×9 · 10 雷</option>
      <option value="mid">中级 16×16 · 40 雷</option>
      <option value="hard">高级 30×16 · 99 雷</option>
    </select>
    <div class="ms-stat" title="剩余雷数（总雷数 − 已插旗）">💣 <span id="ms-mines">10</span></div>
    <button type="button" id="ms-face" title="重新开始">🙂 新游戏</button>
    <div class="ms-stat" title="用时（秒）">⏱ <span id="ms-time">0</span></div>
  </div>
  <div class="ms-bar ms-bar-sub">
    <button type="button" id="ms-flagmode" aria-pressed="false" title="开启后左键点击即插旗（适合手机）">🚩 插旗模式：关</button>
    <span class="ms-hint">手机长按也可插旗</span>
  </div>
  <div id="ms-board" role="grid" aria-label="雷区"></div>
  <p id="ms-msg" class="ms-msg"></p>
</div>
<script src="/minesweeper.js{{ with site.Params.assetVer }}?v={{ . }}{{ end }}" defer></script>
