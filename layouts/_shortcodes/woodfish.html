<!-- 敲木鱼小游戏（2026-11-21）：样式与逻辑均为外链静态文件（CSP 纯同源白名单，禁内联脚本） -->
<!-- 个人中心（个人 / 成就 / 皮肤 / 设置）与排行榜沿用 runner.css 里的面板样式 -->
<div id="wf-root" class="wf-root" aria-label="敲木鱼">
  <div class="wf-bar">
    <div class="wf-merit" title="累计敲击次数">
      <span class="wf-merit-n" id="wf-count">0</span>
      <span class="wf-merit-l">功德</span>
    </div>
    <div class="wf-actions">
      <button type="button" class="wf-btn" id="wf-me-open" data-open-me title="个人中心：头像、昵称、成就与皮肤">个人中心</button>
      <button type="button" class="wf-btn" id="wf-rank-open" title="排行榜：累计敲击次数">排行榜</button>
    </div>
  </div>

  <div class="wf-stage" id="wf-stage">
    <div class="wf-float" id="wf-float" aria-hidden="true"></div>

    <button type="button" class="wf-fish-btn" id="wf-fish" aria-label="敲一下木鱼">
      <span class="wf-fish-wrap">
        <!-- 木鱼：参考极简黑白稿，只有一块实心剪影 + 一道豁到右缘的嘴缝，
             不含木纹、眼睛、槌子与投影；缝的颜色就是画布底色，靠形状咬出开口。 -->
        <svg class="wf-fish" viewBox="24 42 192 140" aria-hidden="true" focusable="false">
          <!-- 外形：左端收成一个尖（鱼尾），顶背高耸，右侧浑圆，底部平缓 -->
          <path class="wf-body" d="M32 140C38 118 48 96 65 82C83 65 104 50 128 49C158 48 184 65 197 88C209 108 210 134 197 151C183 167 155 176 122 176C90 176 58 162 32 140Z"/>
          <!-- 嘴缝：近乎直线的斜缝，中段最宽，右端张开并豁出右缘，把白块切成上薄下厚两瓣 -->
          <path class="wf-mouth" d="M70 132C100 128 140 118 172 106C186 101 198 97 210 93C202 104 190 107 176 111C144 122 104 130 76 136C72 137 68 134 70 132Z"/>
        </svg>
      </span>
    </button>

    <p class="wf-hint" id="wf-hint">点一下木鱼，功德 +1</p>
  </div>

  <p class="wf-sub" id="wf-sub">累计敲击 0 次 · 敲够 10000 次解锁成就「手指酸痛者」</p>
  <p class="wf-note">次数只记在这台设备上；登录云账号后，昵称与头像会显示在排行榜上。</p>
</div>

<!-- ═══ 排行榜弹层：按累计敲击次数降序（样式复用扫雷榜的 .ms-rank 系列） ═══ -->
<div id="wf-rank" class="ms-rank hidden" role="dialog" aria-modal="true" aria-labelledby="wf-rank-title">
  <div class="ms-rank-box">
    <div class="ms-rank-head">
      <strong id="wf-rank-title">敲木鱼排行榜</strong>
      <button type="button" class="ms-rank-x" id="wf-rank-close" title="关闭排行榜" aria-label="关闭排行榜">✕</button>
    </div>
    <div class="ms-rank-status" id="wf-rank-status" role="status" aria-live="polite"></div>
    <ol class="ms-rank-list ms-rank-list-scroll" id="wf-rank-list" aria-label="排行榜前 100 名"></ol>
    <div class="ms-rank-mine" id="wf-rank-mine"></div>
    <p class="ms-rank-foot">
      按累计敲击次数从多到少排，同名只留一条；未登录也能上榜，昵称是<b>访客 N</b>；
      登录后可以在个人中心用自己的昵称，成绩跟着账号走。
    </p>
  </div>
</div>

<!-- ═══ 个人中心（四游戏共用 DOM）：由 me.js 驱动 ═══ -->
