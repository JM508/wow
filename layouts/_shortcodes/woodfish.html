<!-- 敲木鱼小游戏（2026-11-21）：样式与逻辑均为外链静态文件（CSP 纯同源白名单，禁内联脚本） -->
<!-- 个人中心（个人 / 成就 / 皮肤 / 设置）与排行榜沿用 runner.css 里的面板样式 -->
<div id="wf-root" class="wf-root" aria-label="敲木鱼">
  <div class="wf-bar">
    <div class="wf-merit" title="累计敲击次数">
      <span class="wf-merit-n" id="wf-count">0</span>
      <span class="wf-merit-l">功德</span>
    </div>
    <div class="wf-actions">
      <button type="button" class="wf-btn" id="wf-me-open" data-open-me title="个人中心：头像、昵称、成就与皮肤">个人中心</button>
      <button type="button" class="wf-btn" id="wf-rank-open" title="排行榜：累计敲击次数">排行榜</button>
    </div>
  </div>

  <div class="wf-stage" id="wf-stage">
    <button type="button" class="wf-fish-btn" id="wf-fish" aria-label="敲一下木鱼">
      <span class="wf-fish-wrap">
        <!-- 木鱼：只有一块实心剪影，嘴缝豁到右缘，不含木纹、眼睛、槌子与投影 -->
        <svg class="wf-fish" viewBox="-4 -4 312 236" aria-hidden="true" focusable="false">
          <!-- 形状按用户给的黑白稿矢量化（像素边界追踪 + 曲线拟合，与稿子重合度 97.9%）：
               一整块实心剪影，嘴缝右端豁出边缘，因此是单条闭合路径，不再单独画缝。 -->
          <path class="wf-body" d="M164 0C179.5 -2.2 197.1 -0.1 212 3C225.6 5.9 238.6 9.4 250 17C262.5 25.2 277.5 44.6 283 52C285.3 55 286.6 56.4 287 59C287.5 62 287.7 66 285 69C279.3 75.5 258.9 78.8 240 84C209.1 92.5 141.5 100.7 116 111C103.5 116 93.6 120.6 90 127C87.5 131.5 87.7 138.7 90 142C92.3 145.3 97.3 147.4 104 147C122.4 145.9 175.2 106.3 205 96C226.7 88.5 248.4 85.6 264 84C274 83 283.1 81.5 289 84C293.2 85.8 295.7 88.5 298 93C301.9 100.5 303.7 116 304 128C304.3 140.6 302.5 156 299 167C296.2 176 291.6 183.7 287 190C283.1 195.3 279.5 199 274 203C266.9 208.2 258.2 213.2 247 217C231.1 222.4 205.1 226.7 186 228C169.4 229.1 156.8 228.7 139 226C114.5 222.2 76.7 207.3 53 203C36.7 200.1 19.8 204.5 11 199C4.8 195.1 1 186.4 0 181C-0.7 177 0 174.2 2 170C5.6 162.2 18.8 152.2 26 141C34.3 128.1 39.9 109.9 48 96C55.6 83 62.7 72.1 73 60C85.4 45.4 102.6 26.1 119 16C133.2 7.2 148.5 2.2 164 0Z"/>
        </svg>
      </span>
    </button>

    <!-- 飘字排在木鱼之后：同层叠里后来居上，不必提 z-index（提了就自成合成层，
         文字改动时会在 headless 里留下旧字残影） -->
    <div class="wf-float" id="wf-float" aria-hidden="true"></div>

    <p class="wf-hint" id="wf-hint">点击一下木鱼，功德加一</p>
  </div>
</div>

<!-- ═══ 排行榜弹层：按累计敲击次数降序（样式复用扫雷榜的 .ms-rank 系列） ═══ -->
<div id="wf-rank" class="ms-rank hidden" role="dialog" aria-modal="true" aria-labelledby="wf-rank-title">
  <div class="ms-rank-box">
    <div class="ms-rank-head">
      <strong id="wf-rank-title">敲木鱼排行榜</strong>
      <button type="button" class="ms-rank-x" id="wf-rank-close" title="关闭排行榜" aria-label="关闭排行榜">✕</button>
    </div>
    <div class="ms-rank-status" id="wf-rank-status" role="status" aria-live="polite"></div>
    <ol class="ms-rank-list ms-rank-list-scroll" id="wf-rank-list" aria-label="排行榜前 100 名"></ol>
    <div class="ms-rank-mine" id="wf-rank-mine"></div>
    <p class="ms-rank-foot">
      按累计敲击次数从多到少排，同名只留一条；未登录也能上榜，昵称是<b>访客 N</b>；
      登录后可以在个人中心用自己的昵称，成绩跟着账号走。
    </p>
  </div>
</div>

<!-- ═══ 个人中心（四游戏共用 DOM）：由 me.js 驱动 ═══ -->
